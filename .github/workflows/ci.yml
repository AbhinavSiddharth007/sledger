name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Starts Postgres, Auth and the API in Docker, then applies migrations and seed.sql.
      - name: Start local Supabase
        run: |
          npx supabase start
          npm run db:reset
          npm run db:env

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Build
        run: |
          set -a
          . ./.env.test.local
          set +a
          npm run build

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
